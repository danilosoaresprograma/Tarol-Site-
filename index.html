<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mabi Tarô</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>

<header class="fade">
  <h1>Mabi</h1>
  <p>Pergunte sobre qualquer coisa</p>
  <button onclick="scrollToSection()">🔮 Fazer minha pergunta</button>
</header>

<div class="tarot-area fade">

  <div class="card" id="card" onclick="iniciarTiragem()">
    <div class="face front"></div>
    <div class="face back" id="resultado">🔮</div>
  </div>

  <p class="hint">Toque na carta para revelar</p>
</div>

<section id="tiragem" class="fade">
  <h2>Sua pergunta</h2>
  <textarea id="pergunta" placeholder="Ex: Vou conseguir aquele emprego?"></textarea>
  <button onclick="enviarPergunta()">Enviar pergunta</button>
</section>

<footer class="fade">
  <p>@by.mabbi</p>
</footer>

<audio id="som">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-magic-spell-600.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
