<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mabi Tarô</title>

  <!-- Fonte melhor -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FUNDO -->
  <div class="bg"></div>

  <header class="fade">
    <h1>Mabi</h1>
    <p>“Pergunte sobre qualquer coisa!”</p>
    <button onclick="scrollToSection()">Realizar pergunta</button>
  </header>

  <!-- CARTA -->
  <div class="card-container fade" onclick="flipCard()">
    <div class="card" id="card">
      <div class="front"></div>
      <div class="back">✨</div>
    </div>
  </div>

  <section class="sobre fade">
    <h2>Sobre</h2>
    <p>
      Uma cartomante amadora que realiza leituras de tarô.
      Pergunte sobre qualquer área da sua vida.
    </p>
  </section>

  <section class="tiragem fade" id="tiragem">
    <h2>Faça sua pergunta</h2>
    <textarea id="pergunta" placeholder="Digite sua pergunta..."></textarea>
    <button onclick="enviarPergunta()">Enviar</button>
    <p class="gratis">Leitura gratuita</p>
  </section>

  <footer class="fade">
    <p>@by.mabbi</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
