<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mabi Tarô</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FUNDO -->
  <div class="bg"></div>
  <div class="noise"></div>

  <!-- HERO -->
  <header class="fade">
    <h1>Mabi</h1>
    <p class="subtitle">Pergunte sobre qualquer coisa</p>
    <button onclick="scrollToSection()">🔮 Fazer minha pergunta</button>
  </header>

  <!-- CARTAS FLUTUANTES -->
  <div class="floating-cards">
    <div class="card-float"></div>
    <div class="card-float delay1"></div>
    <div class="card-float delay2"></div>
  </div>

  <!-- CARTA INTERATIVA -->
  <div class="card-container fade" onclick="flipCard()">
    <div class="card" id="mainCard">
      <div class="front"></div>
      <div class="back">
        ✨ Revelando energia...
      </div>
    </div>
  </div>

  <!-- SOBRE -->
  <section class="fade">
    <h2>Como funciona</h2>
    <p>
      Faça sua pergunta e receba uma leitura intuitiva.
      Sem julgamentos. Apenas respostas.
    </p>
  </section>

  <!-- TIRAGEM -->
  <section id="tiragem" class="fade">
    <h2>Sua pergunta</h2>
    <textarea id="pergunta" placeholder="Ex: Ele(a) ainda pensa em mim?"></textarea>
    <button onclick="enviarPergunta()">✨ Enviar pergunta</button>
    <p class="gratis">Leitura gratuita</p>
  </section>

  <footer class="fade">
    <p>@by.mabbi</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
